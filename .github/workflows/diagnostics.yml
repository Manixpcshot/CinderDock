name: Windows build diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - arena/89794682-cinderdock
    paths-ignore:
      - .ci-diagnostics/**
      - src-tauri/Cargo.lock

permissions:
  contents: write

concurrency:
  group: windows-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-diagnostics:
    name: Capture Windows build and smoke logs
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Build Tauri and capture log
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .ci-diagnostics | Out-Null
          $log = '.ci-diagnostics/windows-build.log'
          npx tauri build --verbose *> $log
          $code = $LASTEXITCODE
          Set-Content -Path .ci-diagnostics/windows-build.exit -Value "$code" -Encoding ascii
          if ($code -ne 0) {
            Write-Host "Tauri build failed with exit code $code"
            Get-Content $log -Tail 100
          }
      - name: Smoke test portable executable
        shell: pwsh
        run: |
          $code = Get-Content .ci-diagnostics/windows-build.exit -Raw
          if ($code.Trim() -ne '0') {
            Set-Content -Path .ci-diagnostics/windows-smoke.log -Value 'Skipped: build failed.' -Encoding utf8
            Set-Content -Path .ci-diagnostics/windows-smoke.err -Value '' -Encoding utf8
            Set-Content -Path .ci-diagnostics/windows-smoke.exit -Value 'skipped' -Encoding ascii
            return
          }
          $portable = Get-ChildItem -Path src-tauri/target -Recurse -Filter CinderDock.exe | Where-Object { $_.FullName -notlike '*\bundle\*' } | Select-Object -First 1
          if (-not $portable) {
            Set-Content -Path .ci-diagnostics/windows-smoke.log -Value 'Portable executable missing.' -Encoding utf8
            Set-Content -Path .ci-diagnostics/windows-smoke.exit -Value 'missing' -Encoding ascii
            return
          }
          $stdout = '.ci-diagnostics/windows-smoke.log'
          $stderr = '.ci-diagnostics/windows-smoke.err'
          $process = Start-Process -FilePath $portable.FullName -ArgumentList '--cinderdock-smoke-test' -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr -WindowStyle Hidden
          Set-Content -Path .ci-diagnostics/windows-smoke.exit -Value "$($process.ExitCode)" -Encoding ascii
          $ui = Start-Process -FilePath $portable.FullName -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 8
          if ($ui.HasExited) {
            Add-Content -Path .ci-diagnostics/windows-smoke.err -Value "Window exited early with code $($ui.ExitCode)"
          } else {
            Stop-Process -Id $ui.Id -Force
          }
      - name: Commit diagnostics to this branch
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin "$BRANCH"
          git add -f .ci-diagnostics
          if git diff --cached --quiet; then
            echo 'No diagnostics changes.'
          else
            git commit -m 'chore: capture Windows build diagnostics'
            git push origin "HEAD:$BRANCH"
          fi
