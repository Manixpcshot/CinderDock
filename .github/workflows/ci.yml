name: CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks and UI tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify version consistency
        run: node scripts/check-version.mjs consistent
      - name: Verify semantic version bump
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        env:
          CINDERDOCK_BASE_REF: ${{ github.event.before || 'origin/main' }}
        run: node scripts/check-version.mjs bump
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: UI tests
        run: npm test
      - name: Production frontend build
        run: npm run build

  rust:
    name: Rust fmt, Clippy and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux Tauri dependencies
        run: |
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -qq; then break; fi
            sleep 5
          done
          timeout 900 sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend assets for Tauri context
        run: npm run build
      - name: Generate Cargo lockfile if absent
        working-directory: src-tauri
        shell: bash
        run: |
          if [ ! -f Cargo.lock ]; then
            cargo generate-lockfile
          fi
      - name: Upload generated Cargo.lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lockfile
          path: src-tauri/Cargo.lock
          if-no-files-found: warn
      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --all-targets --all-features

  windows-build:
    name: Real Windows x64 build and smoke test
    runs-on: windows-latest
    needs:
      - frontend
      - rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Build Tauri Windows bundle
        run: npx tauri build --verbose
      - name: Smoke test portable executable
        shell: pwsh
        run: |
          $portable = Get-ChildItem -Path src-tauri/target -Recurse -Filter CinderDock.exe | Where-Object { $_.FullName -notlike '*\bundle\*' } | Select-Object -First 1
          if (-not $portable) { throw 'Portable executable was not produced.' }
          $stdout = Join-Path $env:RUNNER_TEMP 'cinderdock-smoke.json'
          $stderr = Join-Path $env:RUNNER_TEMP 'cinderdock-smoke.err'
          $process = Start-Process -FilePath $portable.FullName -ArgumentList '--cinderdock-smoke-test' -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw "Smoke test failed with exit code $($process.ExitCode)."
          }
          $report = Get-Content $stdout -Raw -ErrorAction SilentlyContinue
          if ($report -and $report -notmatch '"ok"\s*:\s*true') {
            throw "Smoke report did not report success: $report"
          }
          Write-Host 'Command-line smoke test passed.'
          $ui = Start-Process -FilePath $portable.FullName -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 8
          if ($ui.HasExited) {
            throw "CinderDock window exited early with code $($ui.ExitCode)."
          }
          Stop-Process -Id $ui.Id -Force
          Write-Host 'Window launch smoke test passed.'
      - name: Upload Windows build preview
        uses: actions/upload-artifact@v4
        with:
          name: cinderdock-windows-preview
          path: |
            src-tauri/target/release/CinderDock.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
