[package]
name = "cinderdock"
version = "0.1.0"
description = "A local-first AI coding desk for Windows"
authors = ["CinderDock contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
repository = "https://github.com/Manixpcshot/CinderDock"
default-run = "cinderdock"

[lib]
name = "cinderdock_lib"
path = "src/lib.rs"

[[bin]]
name = "cinderdock"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
tauri = { version = "2.1.1", features = [] }
tauri-plugin-dialog = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
  "gzip",
  "brotli",
  "charset",
  "http2",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
similar = "2.6"
walkdir = "2.5"
url = "2.5"
regex = "1.11"
sha2 = "0.10"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dirs = "5.0"

[dev-dependencies]
tempfile = "3.14"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
